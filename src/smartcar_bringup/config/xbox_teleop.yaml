# Xbox 手柄与统一遥控节点参数配置文件
joy_node:
  ros__parameters:
    device_id: 0
    device_name: ""
    deadzone: 0.05
    autorepeat_rate: 20.0

joystick_teleop_node:
  ros__parameters:
    # 左摇杆映射：Axis 1 前后，Axis 0 旋转；右摇杆不参与控制。
    axis_linear_x: 1
    axis_angular_z: 0
    linear_x_scale: 0.5        # 左摇杆普通模式线速度 (m/s)
    linear_x_turbo_scale: 1.0  # 左摇杆 Turbo 模式线速度 (m/s)
    angular_z_scale: 1.5       # 左摇杆普通模式角速度 (rad/s)
    angular_z_turbo_scale: 3.0 # 左摇杆 Turbo 模式角速度 (rad/s)

    # 当前 Xbox 手柄只发布 11 个按钮，D-pad 使用 Axis 6/7。
    dpad_mode: axes
    dpad_axis_horizontal: 6
    dpad_axis_vertical: 7
    # 兼容其他手柄的按钮索引（当前 Xbox 手柄不使用）。
    dpad_button_up: 12
    dpad_button_down: 13
    dpad_button_left: 14
    dpad_button_right: 15
    dpad_deadzone: 0.5
    dpad_speed: 0.5        # 方向键普通模式恒定平移速度 (m/s)
    dpad_turbo_speed: 1.0  # 方向键 Turbo 模式恒定平移速度 (m/s)

    enable_button: 4       # LB 按键使能 (Button 4)
    require_enable_button: true
    enable_turbo_button: 5 # RB 按键加速 (Button 5)

    input_timeout: 0.5
    publish_rate: 20.0
    frame_id: base_footprint
